description: shenlun-material-hub AI 文章评估与素材卡生成回归测试

providers:
  - id: openai:chat:deepseek-v4-flash
    config:
      apiBaseUrl: "{{env.PROMPTFOO_API_BASE_URL}}"
      apiKey: "{{env.PROMPTFOO_API_KEY}}"
      model: "deepseek-v4-flash"
      temperature: 0.2
      response_format:
        type: json_object

prompts:
  - id: article-evaluation
    label: 文章评估
    raw: file://prompts/article-evaluation.txt

  - id: card-golden-sentence
    label: 素材卡-金句
    raw: file://prompts/card-golden-sentence.txt

  - id: card-case-material
    label: 素材卡-案例
    raw: file://prompts/card-case-material.txt

# Promptfoo JS assertions receive (output, context, process).
# Use context.vars to access test variables.
# DeepSeek may prepend "Thinking: ..." before JSON — use regex to extract JSON.

tests:
  # ─── Article evaluation tests (prompts: ["article-evaluation"]) ───

  - description: "文章评估-基层治理案例应接受"
    prompts: ["文章评估"]
    vars:
      title: "党建引领基层治理新实践"
      sourceName: "人民日报"
      contentType: "article"
      content: "某市积极探索党建引领基层治理新模式，通过网格化管理、数字化平台、群众议事机制三大抓手，有效提升了基层治理效能。该市在120个社区推行'红色物业'模式，投入资金2.3亿元改造老旧小区，惠及15万群众。建立了'民情日记'制度，累计收集群众诉求8.6万件，办结率达95%。同时，该市创新推出'社区议事厅'平台，让居民参与社区重大事项决策，实现了'小事不出楼栋、大事不出社区'的治理目标。专家指出，这一实践充分证明，只有把党的组织优势转化为治理优势，才能真正破解基层治理难题。"
      expectedDecision: "accept"
      expectedGenre: "case_practice"
    assert:
      - type: javascript
        value: |
          const jsonMatch = output.match(/\{[\s\S]*\}/);
          if (!jsonMatch) return { pass: false, score: 0, reason: 'No JSON object found in output' };
          try { JSON.parse(jsonMatch[0]); } catch(e) { return { pass: false, score: 0, reason: `Invalid JSON: ${e.message}` }; }
          return { pass: true, score: 1, reason: 'Valid JSON found' };
      - type: javascript
        value: |
          const jsonMatch = output.match(/\{[\s\S]*\}/);
          const p = JSON.parse(jsonMatch[0]);
          if (!['accept','reject'].includes(p.decision)) {
            return { pass: false, score: 0, reason: `decision "${p.decision}" invalid` };
          }
          return { pass: true, score: 1, reason: 'decision valid' };
      - type: javascript
        value: |
          const jsonMatch = output.match(/\{[\s\S]*\}/);
          const p = JSON.parse(jsonMatch[0]);
          const genres = ['commentary','policy_interpretation','case_practice','ordinary_news','meeting_news','notice','other'];
          if (!genres.includes(p.contentGenre)) {
            return { pass: false, score: 0, reason: `contentGenre "${p.contentGenre}" invalid` };
          }
          return { pass: true, score: 1, reason: 'contentGenre valid' };
      - type: javascript
        value: |
          const jsonMatch = output.match(/\{[\s\S]*\}/);
          const p = JSON.parse(jsonMatch[0]);
          if (!p.reason || p.reason.trim().length === 0) {
            return { pass: false, score: 0, reason: 'reason is empty' };
          }
          if (p.reason.length > 100) {
            return { pass: false, score: 0.5, reason: `reason ${p.reason.length} chars > 100` };
          }
          return { pass: true, score: 1, reason: 'reason valid' };
      - type: javascript
        value: |
          const jsonMatch = output.match(/\{[\s\S]*\}/);
          const p = JSON.parse(jsonMatch[0]);
          if (!Array.isArray(p.categories)) return { pass: false, score: 0, reason: 'categories not array' };
          if (!Array.isArray(p.usableFor)) return { pass: false, score: 0, reason: 'usableFor not array' };
          if (!Array.isArray(p.quotes)) return { pass: false, score: 0, reason: 'quotes not array' };
          return { pass: true, score: 1, reason: 'all array fields valid' };
      - type: javascript
        value: |
          const jsonMatch = output.match(/\{[\s\S]*\}/);
          const p = JSON.parse(jsonMatch[0]);
          if (p.decision === 'accept') {
            if (p.categories.length < 1) return { pass: false, score: 0, reason: 'accept but categories empty' };
            if (p.quotes.length < 1) return { pass: false, score: 0.5, reason: 'accept but quotes empty' };
          }
          return { pass: true, score: 1, reason: 'accept constraints ok' };
      - type: javascript
        value: |
          const jsonMatch = output.match(/\{[\s\S]*\}/);
          const p = JSON.parse(jsonMatch[0]);
          const expected = context.vars.expectedDecision;
          if (p.decision !== expected) {
            return { pass: false, score: 0, reason: `expected "${expected}" got "${p.decision}"` };
          }
          return { pass: true, score: 1, reason: `decision matches "${expected}"` };
      - type: javascript
        value: |
          const jsonMatch = output.match(/\{[\s\S]*\}/);
          const p = JSON.parse(jsonMatch[0]);
          const expected = context.vars.expectedGenre;
          if (p.contentGenre !== expected) {
            return { pass: false, score: 0.5, reason: `expected genre "${expected}" got "${p.contentGenre}"` };
          }
          return { pass: true, score: 1, reason: `genre matches "${expected}"` };

  - description: "文章评估-会议新闻应拒绝"
