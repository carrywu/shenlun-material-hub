services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shenlun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: shenlun_material_hub
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shenlun"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    image: ccr.ccs.tencentyun.com/carrywu/shenlun:${IMAGE_TAG:-latest}
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://shenlun:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/shenlun_material_hub?schema=public
    volumes:
      - ./data/uploads:/app/public/uploads
    expose:
      - "3000"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  wewe-rss:
    image: ccr.ccs.tencentyun.com/carrywu/wewe-rss:v2.6.1
    container_name: wewe-rss
    environment:
      - DATABASE_TYPE=sqlite
      - AUTH_CODE=${WEWERSS_AUTH_CODE:-}
      - SERVER_ORIGIN_URL=${NEXT_PUBLIC_APP_URL:-http://localhost}:4000
      - FEED_MODE=fulltext
      - CRON_EXPRESSION=35 5,17 * * *
      - MAX_REQUEST_PER_MINUTE=60
    volumes:
      - wewe_rss_data:/app/data
    ports:
      - "4000:4000"
    networks:
      - internal
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  wewe_rss_data:

networks:
  internal:
    driver: bridge
