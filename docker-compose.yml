services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shenlun
      # ⚠️ 生产环境务必通过 .env 设置 POSTGRES_PASSWORD，不要使用默认值
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: shenlun_material_hub
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shenlun"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://shenlun:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/shenlun_material_hub?schema=public
    volumes:
      - ./data/uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional local WeWe RSS sidecar.
  # Keep it separate from the main app runtime boundary.
  # NOTE: 本项目只读消费 WeWe RSS 数据，不写入其数据库。
  wewe-rss:
    profiles: ["wewe-rss"]
    extends:
      file: ./infra/wechat-rss/wewe-rss/docker-compose.yml
      service: wewe-rss

volumes:
  pgdata:
