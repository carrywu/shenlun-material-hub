services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:./prisma/dev.db
    volumes:
      - ./data/prisma:/app/prisma
      - ./data/uploads:/app/public/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional local WeWe RSS sidecar.
  # Keep it separate from the main app runtime boundary.
  # NOTE: 本项目只读消费 WeWe RSS 数据，不写入其数据库。
  wewe-rss:
    profiles: ["wewe-rss"]
    extends:
      file: ./infra/wechat-rss/wewe-rss/docker-compose.yml
      service: wewe-rss
