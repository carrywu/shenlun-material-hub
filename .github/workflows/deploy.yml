name: Build & Deploy to TCR

on:
  workflow_dispatch:

env:
  TCR_REGISTRY: ccr.ccs.tencentyun.com
  TCR_NAMESPACE: carrywu
  TCR_REPO: shenlun
  IMAGE_NAME: ccr.ccs.tencentyun.com/carrywu/shenlun
  SERVER_HOST: 47.119.182.210
  SERVER_USER: root
  SERVER_DEPLOY_DIR: /opt/shenlun-material-hub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Compute tags
        id: tags
        run: |
          TIMESTAMP="$(date +%Y%m%d-%H%M)"
          GIT_SHA="$(git rev-parse --short HEAD)"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "git_sha=$GIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.timestamp }}
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.git_sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ env.SERVER_DEPLOY_DIR }}
            bash scripts/deploy/server-pull-and-restart.sh --tag ${{ steps.tags.outputs.timestamp }}

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' "http://${{ env.SERVER_HOST }}/api/health" 2>/dev/null || echo '000')
            BODY=$(curl -sS "http://${{ env.SERVER_HOST }}/api/health" 2>/dev/null || echo '')
            if echo "$BODY" | grep -q '"ok".*true'; then
              echo "✅ Health check passed (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Health check attempt $i/12 (HTTP $HTTP_CODE), retrying in 10s..."
            sleep 10
          done
          echo "❌ Health check failed"
          exit 1
